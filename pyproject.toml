[project]
name = "revenue-recovery"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115", "uvicorn[standard]>=0.30", "pydantic>=2.8",
  "PyYAML>=6.0", "sqlalchemy>=2.0", "psycopg[binary]>=3.2",
  "alembic>=1.13", "ulid-py>=1.1", "apscheduler>=3.10", "httpx>=0.27"
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "ruff>=0.6", "mypy>=1.11"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["backend*", "sim*", "eval*"]

[tool.setuptools.package-data]
backend = ["resources/config/*.yaml", "resources/config/sim/*.yaml"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

[tool.ruff]
line-length = 100

[tool.mypy]
python_version = "3.11"
strict = true
ignore_missing_imports = true
